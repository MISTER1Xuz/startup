\<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YASHIL YO'L v3.1 | 100+ Real Time Fleet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-950 text-gray-200 h-screen flex flex-col overflow-hidden font-sans">

    <!-- Top Navigation -->
    <header class="h-16 bg-gray-900/90 backdrop-blur-md border-b border-gray-800 flex items-center justify-between px-6 z-50">
        <div class="flex items-center space-x-4">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                <i class="fas fa-route text-gray-950 text-xl font-bold"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">YASHIL <span class="text-emerald-400">YO'L</span></h1>
            <span class="text-xs font-mono bg-emerald-950 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-800/60">100+ REAL FLEET</span>
        </div>
        
        <div class="flex items-center space-x-4 text-sm">
            <div class="flex items-center space-x-2 bg-gray-800/80 px-3.5 py-1.5 rounded-full border border-gray-700/60">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-emerald-400 font-semibold">100 ta Texnika Faol</span>
            </div>
            <div class="flex items-center space-x-2 text-gray-300 bg-gray-800/80 px-3.5 py-1.5 rounded-full border border-gray-700/60">
                <i class="far fa-clock text-emerald-400"></i>
                <span id="current-time" class="font-mono">--:--:--</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1 relative overflow-hidden">
        
        <!-- Left Control Panel -->
        <aside class="w-[420px] bg-gray-900/95 backdrop-blur-xl border-r border-gray-800 flex flex-col p-6 space-y-5 z-40 overflow-y-auto">
            
            <!-- Emergency Alert Card -->
            <section id="active-emergency-card" class="hidden">
                <div class="bg-red-950/40 border border-red-700 rounded-2xl p-4 space-y-2 shadow-xl">
                    <div class="flex justify-between items-center">
                        <h3 id="emer-type" class="text-sm font-bold text-white">Koridor Ochiq</h3>
                        <span id="status-badge" class="px-2 py-0.5 text-[10px] font-bold bg-red-500 text-white rounded-full uppercase">Qizil</span>
                    </div>
                    <p id="emer-location" class="text-xs text-red-300">Manzil...</p>
                </div>
            </section>

            <!-- Quick Trigger Actions -->
            <section>
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Tezkor Favqulodda Koridor</h2>
                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="simulateEmergency('Tez Yordam', [41.3115, 69.2797])" class="action-card bg-gray-800/70 p-3 rounded-xl border border-gray-700 hover:border-emerald-500 text-left">
                        <i class="fas fa-ambulance text-emerald-400 mb-1 text-base block"></i>
                        <span class="font-semibold text-white text-xs block">Tez Yordam</span>
                    </button>
                    <button onclick="simulateEmergency('O\'t O\'chirish', [41.3456, 69.2878])" class="action-card bg-gray-800/70 p-3 rounded-xl border border-gray-700 hover:border-red-500 text-left">
                        <i class="fas fa-fire-extinguisher text-red-400 mb-1 text-base block"></i>
                        <span class="font-semibold text-white text-xs block">O't O'chiruvchi</span>
                    </button>
                    <button onclick="clearEmergency()" class="col-span-2 bg-gray-800/70 p-2.5 rounded-xl border border-gray-700 hover:bg-red-950/40 hover:border-red-600 flex items-center justify-center gap-2">
                        <i class="fas fa-ban text-red-400"></i>
                        <span class="font-semibold text-white text-xs">Barcha Koridorlarni Tozalash</span>
                    </button>
                </div>
            </section>

            <!-- Filters for 100 vehicles -->
            <section>
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Filtrlar (100 ta texnika)</h2>
                <div class="flex flex-wrap gap-1.5">
                    <button onclick="filterVehicles('ALL')" class="px-3 py-1 bg-gray-800 hover:bg-emerald-600 text-xs rounded-lg border border-gray-700 text-white transition-all">Hammasi</button>
                    <button onclick="filterVehicles('Tez Yordam')" class="px-3 py-1 bg-gray-800 hover:bg-emerald-600 text-xs rounded-lg border border-gray-700 text-white transition-all">Tez Yordam</button>
                    <button onclick="filterVehicles('O\'t O\'chirish')" class="px-3 py-1 bg-gray-800 hover:bg-emerald-600 text-xs rounded-lg border border-gray-700 text-white transition-all">O't O'chirish</button>
                    <button onclick="filterVehicles('YPX Patrul')" class="px-3 py-1 bg-gray-800 hover:bg-emerald-600 text-xs rounded-lg border border-gray-700 text-white transition-all">YPX</button>
                    <button onclick="filterVehicles('Maxsus Kortej')" class="px-3 py-1 bg-gray-800 hover:bg-emerald-600 text-xs rounded-lg border border-gray-700 text-white transition-all">Kortej</button>
                </div>
            </section>

            <!-- Vehicle List Container -->
            <section class="flex-1">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Faol Texnikalar Ro'yxati</h2>
                <div id="active-routes-list" class="space-y-2 max-h-[300px] overflow-y-auto pr-1">
                    <!-- Dinamik ravishda 100 tadan chiqadi -->
                </div>
            </section>

        </aside>

        <!-- Map Container -->
        <main class="flex-1 h-full relative">
            <div id="map" class="w-full h-full absolute inset-0 z-10"></div>
        </main>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
