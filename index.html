<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YASHIL YO'L v3.1 | Toshkent Smart City</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-950 text-gray-200 h-screen flex flex-col overflow-hidden font-sans">

    <!-- Top Navigation Bar -->
    <header class="h-16 bg-gray-900/90 backdrop-blur-md border-b border-gray-800 flex items-center justify-between px-6 z-50">
        <div class="flex items-center space-x-4">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                <i class="fas fa-route text-gray-950 text-xl font-bold"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">YASHIL <span class="text-emerald-400">YO'L</span></h1>
            <span class="text-xs font-mono bg-emerald-950 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-800/60">TOSHKENT v3.1</span>
        </div>
        
        <div class="flex items-center space-x-4 text-sm">
            <div class="flex items-center space-x-2 bg-gray-800/80 px-3.5 py-1.5 rounded-full border border-gray-700/60 shadow-inner">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-emerald-400 font-semibold">Server: ON-LINE</span>
            </div>
            <div class="flex items-center space-x-2 text-gray-300 bg-gray-800/80 px-3.5 py-1.5 rounded-full border border-gray-700/60">
                <i class="far fa-clock text-emerald-400"></i>
                <span id="current-time" class="font-mono">--:--:--</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex flex-1 relative overflow-hidden">
        
        <!-- Left Control Panel -->
        <aside class="w-[400px] bg-gray-900/95 backdrop-blur-xl border-r border-gray-800 flex flex-col p-6 space-y-6 z-40 overflow-y-auto">
            
            <!-- Current Emergency Section -->
            <section id="active-emergency-card" class="hidden transition-all duration-300">
                <h2 class="text-xs font-bold text-red-400 flex items-center gap-2 mb-2 uppercase tracking-wider">
                    <i class="fas fa-exclamation-triangle animate-bounce"></i> Favqulodda Holat Faol
                </h2>
                <div class="emergency-active bg-red-950/40 border border-red-700 rounded-2xl p-4 space-y-2 shadow-xl">
                    <div class="flex justify-between items-center">
                        <h3 id="emer-type" class="text-base font-bold text-white">Tez Yordam</h3>
                        <span id="status-badge" class="px-2 py-0.5 text-[10px] font-bold bg-red-500 text-white rounded-full uppercase tracking-wider">Qizil Bosqich</span>
                    </div>
                    <p id="emer-location" class="text-xs text-red-300">Koordinatalar yuklanmoqda...</p>
                </div>
            </section>

            <!-- Quick Actions (Ko'paytirilgan tugmalar) -->
            <section>
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fas fa-bolt text-emerald-400"></i> Tezkor Koridor O'rnatish
                </h2>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="simulateEmergency('Tez Yordam', [41.3115, 69.2797], 'Tez Yordam')" class="action-card bg-gray-800/70 p-3.5 rounded-2xl border border-gray-700/80 hover:border-emerald-500 text-left">
                        <i class="fas fa-ambulance text-emerald-400 mb-2 text-xl block"></i>
                        <span class="font-semibold text-white text-sm block">Tez Yordam</span>
                        <span class="text-[10px] text-gray-400">Amir Temur ko'chasi</span>
                    </button>
                    
                    <button onclick="simulateEmergency('O\'t O\'chirish', [41.3456, 69.2878], 'Ochirish')" class="action-card bg-gray-800/70 p-3.5 rounded-2xl border border-gray-700/80 hover:border-red-500 text-left">
                        <i class="fas fa-fire-extinguisher text-red-400 mb-2 text-xl block"></i>
                        <span class="font-semibold text-white text-sm block">O't O'chiruvchi</span>
                        <span class="text-[10px] text-gray-400">Yunusobod tumani</span>
                    </button>
                    
                    <button onclick="simulateEmergency('YPX Patrul', [41.2911, 69.2401], 'YPX')" class="action-card bg-gray-800/70 p-3.5 rounded-2xl border border-gray-700/80 hover:border-blue-500 text-left">
                        <i class="fas fa-car-side text-blue-400 mb-2 text-xl block"></i>
                        <span class="font-semibold text-white text-sm block">YPX Patrul</span>
                        <span class="text-[10px] text-gray-400">Bunyodkor ko'chasi</span>
                    </button>

                    <button onclick="simulateEmergency('Maxsus Kortej', [41.3270, 69.2300], 'Kortej')" class="action-card bg-gray-800/70 p-3.5 rounded-2xl border border-gray-700/80 hover:border-purple-500 text-left">
                        <i class="fas fa-shield-alt text-purple-400 mb-2 text-xl block"></i>
                        <span class="font-semibold text-white text-sm block">Maxsus Kortej</span>
                        <span class="text-[10px] text-gray-400">Beruniy ko'chasi</span>
                    </button>

                    <button onclick="simulateEmergency('Qutqaruvchi MASH', [41.3000, 69.2500], 'Qutqaruv')" class="action-card bg-gray-800/70 p-3.5 rounded-2xl border border-gray-700/80 hover:border-amber-500 text-left">
                        <i class="fas fa-truck-monster text-amber-400 mb-2 text-xl block"></i>
                        <span class="font-semibold text-white text-sm block">Qutqaruv Xizmati</span>
                        <span class="text-[10px] text-gray-400">Markaziyoh</span>
                    </button>

                    <button onclick="clearEmergency()" class="action-card bg-gray-800/70 p-3.5 rounded-2xl border border-gray-700/80 hover:bg-red-950/30 hover:border-red-600 transition-all flex flex-col items-center justify-center group">
                        <i class="fas fa-ban text-gray-400 mb-2 text-xl group-hover:text-red-400 group-hover:rotate-90 transition-transform"></i>
                        <span class="font-semibold text-white text-sm">Bekor Qilish</span>
                        <span class="text-[10px] text-gray-400">Tozalash</span>
                    </button>
                </div>
            </section>

            <!-- Active Routes List -->
            <section class="flex-1">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Faol Koridorlar Monitiringi</h2>
                <div id="active-routes-list" class="space-y-3">
                    <div class="flex items-center justify-center h-24 text-gray-500 italic text-xs border border-dashed border-gray-800 rounded-2xl">
                        Faol koridorlar yo'q...
                    </div>
                </div>
            </section>

        </aside>

        <!-- Map Container -->
        <main class="flex-1 h-full relative">
            <div id="map" class="w-full h-full absolute inset-0 z-10"></div>
        </main>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
