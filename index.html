<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yashil Yo'l - Smart City Trassa Dispetcheri</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Professional HUD Boshqaruv Paneli -->
    <div class="hud-panel">
        <h1>YASHIL YO'L <span>TRACER</span></h1>
        <p>Toshkent Shahri Maxsus Trassa Tizimi</p>
        
        <div class="stat-row">Satelit Holati: <span id="sys-status">BARQAROR (4K)</span></div>
        <div class="stat-row">Faol Transport: <span id="active-vehicle" style="color:#ff3333">103 - Tez Yordam</span></div>
        <div class="stat-row">Svetofor Holati: <span id="light-mode" style="color:#ffcc00">TIRBANDLIK (5s qizil)</span></div>
        <div class="stat-row">Trassa Holati: <span style="color:#00ff80">OCHIQ (GREEN WAVE)</span></div>

        <button class="action-btn" id="waveBtn">🚨 Green Wave Majburiy Ochish</button>
        
        <!-- Terminal Loglari -->
        <div class="terminal-box" id="terminalLog">
            [00:01] Trassa xaritasi yuklandi...<br>
            [00:02] Transport marshrutga chiqdi...
        </div>
    </div>

    <!-- Xarita -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- GPS Tracker & Routes -->
    <script src="gps_tracker.js"></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
