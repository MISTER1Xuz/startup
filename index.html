<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yashil Yo'l - Sun'iy Yo'ldosh Animatsiyasi</title>
    <!-- Leaflet CSS (Xarita uchun) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Sizning uslublar faylingiz -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HUD Boshqaruv Paneli -->
    <div class="hud-panel">
        <h1>YASHIL YO'L - SATELLITE</h1>
        <p>Toshkent Smart City GPS & Green Wave</p>
        <div class="stat-row">Tizim: <span id="sys-status">FAOL (Satelit)</span></div>
        <div class="stat-row">GPS Tracker: <span id="gps-status">Ulangan</span></div>
        <button class="action-btn" id="emergencyBtn">🚨 Yashil To'lqinni Yoqish</button>
    </div>

    <!-- Xarita konteyneri -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- GPS Tracker mantiqi -->
    <script src="gps_tracker.js"></script>
    <!-- Asosiy dastur fayli -->
    <script src="app.js"></script>
</body>
</html>
